[project]
name = "face-verification-web"
version = "0.1.0"
description = "Vercel demo API for face-verification (enroll, 1:1 verify, 1:N identify)."
requires-python = ">=3.10"
dependencies = [
    "face-verification",
    "fastapi>=0.117.1",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.16",
    "numpy>=1.24",
    "Pillow>=10",
]

[tool.uv.sources]
face-verification = { path = "../../packages/face-verification", editable = true }

[tool.uv]
package = false
