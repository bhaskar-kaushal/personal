[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-verification"
version = "0.1.0"
description = "Offline 1:1 facial identity verification (SCRFD + ArcFace via ONNX Runtime)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
face-verify = "face_verification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
