[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-verification"
version = "0.1.0"
description = "Offline 1:1 facial identity verification (SCRFD + ArcFace via ONNX Runtime)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
# The CLI (image loading, default resize/warp) needs OpenCV; a deployment that
# supplies its own Pillow-based resize/warp (see pillow_ops.py) does not.
cv2 = ["opencv-python-headless>=4.8"]
pillow = ["Pillow>=10"]
dev = ["pytest>=7", "opencv-python-headless>=4.8", "Pillow>=10"]

[project.scripts]
face-verify = "face_verification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
